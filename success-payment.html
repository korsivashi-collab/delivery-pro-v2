<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <title>결제 확인 | 배송경로PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <main class="max-w-lg mx-auto px-5 py-12 text-center">
        <div class="w-16 h-16 mx-auto rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-2xl"><i id="status-icon" class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i></div>
        <h1 id="title" class="text-2xl font-black mt-6">결제를 확인하고 있습니다</h1>
        <p id="message" role="status" aria-live="polite" class="text-sm text-slate-600 mt-3 whitespace-pre-line">승인과 계정 등록이 완료될 때까지 기다려 주세요.</p>
        <section id="result" hidden class="mt-7 bg-white border border-slate-200 rounded-2xl p-6 shadow-sm text-left">
            <p class="text-sm text-slate-500">라이선스 키</p><p id="license-key" class="mt-2 text-2xl font-black text-blue-600 break-all"></p>
            <button id="copy-btn" type="button" class="mt-3 border border-blue-600 text-blue-600 rounded-lg px-4 py-2 text-sm font-bold">키 복사하기</button>
            <dl class="mt-5 border-t pt-4 flex justify-between text-sm"><dt>이용 만료일</dt><dd id="expire-date" class="font-bold"></dd></dl>
            <p class="text-xs text-slate-500 mt-4">라이선스 키를 보관하고 앱의 인증 화면에 입력해 주세요.</p>
        </section>
        <aside id="app-guide" hidden class="mt-4 rounded-2xl border-2 border-blue-200 bg-blue-50 p-5 text-left text-sm font-bold leading-relaxed text-blue-900">📱 [배송경로PRO] 앱을 열고 본인 휴대폰 번호와 위 라이선스 키를 입력하면 바로 시작됩니다.</aside>
        <p id="order-label" class="text-xs text-slate-500 mt-5 break-all"></p>
        <button id="retry-btn" type="button" hidden class="w-full mt-6 bg-blue-600 text-white font-bold rounded-xl py-4">승인 결과 다시 확인</button>
        <a id="home-link" href="/index.html" hidden class="block mt-6 bg-blue-600 text-white font-bold rounded-xl py-4">배송경로PRO 시작하기</a>
    </main>
    <script>
        const query = new URLSearchParams(location.search);
        const input = { paymentKey: query.get('paymentKey'), orderId: query.get('orderId'), amount: Number(query.get('amount')),
            phone: query.get('phone'), months: Number(query.get('months')) };
        const message = document.getElementById('message');
        const retry = document.getElementById('retry-btn');
        const copyButton = document.getElementById('copy-btn');
        const copyButtonLabel = copyButton.textContent;
        let copyFeedbackTimer = null;
        let busy = false, licenseKey = '';
        if (input.orderId) document.getElementById('order-label').textContent = '주문번호: ' + input.orderId;
        async function confirmPayment() {
            if (busy) return;
            if (!input.paymentKey || !input.orderId || !input.phone || !Number.isSafeInteger(input.amount) || input.amount <= 0 || ![1, 3, 6, 12].includes(input.months)) {
                document.getElementById('title').textContent = '결제 정보를 확인할 수 없습니다';
                document.getElementById('status-icon').className = 'fa-solid fa-circle-exclamation';
                message.textContent = '결제 후 이동한 완료 페이지에서 다시 확인해 주세요. 결제했다면 주문번호로 고객센터에 문의해 주세요.'; return;
            }
            busy = true; retry.hidden = true;
            document.getElementById('title').textContent = '결제를 확인하고 있습니다';
            document.getElementById('status-icon').className = 'fa-solid fa-spinner fa-spin';
            message.textContent = '승인과 계정 등록을 확인하고 있습니다…';
            try {
                const response = await fetch('/api/payment-confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(input) });
                const data = await response.json();
                if (!response.ok || !data.success) throw new Error(data.error || '결제 결과를 확인하지 못했습니다.');
                licenseKey = data.licenseKey;
                document.getElementById('title').textContent = '이용권 등록이 완료되었습니다';
                document.getElementById('status-icon').className = 'fa-solid fa-check';
                message.textContent = '결제가 완료되었습니다. 아래 키로 앱에서 인증해 주세요.';
                document.getElementById('license-key').textContent = licenseKey;
                document.getElementById('expire-date').textContent = data.expireDate;
                document.getElementById('result').hidden = false;
                document.getElementById('app-guide').hidden = false;
                document.getElementById('home-link').hidden = false;
                // 새로고침 시 서버 감사 로그에서 같은 결과를 반환하므로 기간이 중복 연장되지 않습니다.
            } catch (error) {
                document.getElementById('title').textContent = '결제 결과 확인이 필요합니다';
                document.getElementById('status-icon').className = 'fa-solid fa-circle-exclamation';
                message.textContent = (error.message || '결과 확인에 실패했습니다.') + '\n재결제하지 말고 아래 버튼으로 다시 확인해 주세요.';
                retry.hidden = false;
            } finally { busy = false; }
        }
        retry.addEventListener('click', confirmPayment);
        copyButton.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(licenseKey);
                message.textContent = '라이선스 키를 복사했습니다.';
                clearTimeout(copyFeedbackTimer);
                copyButton.textContent = '✅ 복사 완료!';
                copyFeedbackTimer = setTimeout(() => {
                    copyButton.textContent = copyButtonLabel;
                    copyFeedbackTimer = null;
                }, 2000);
            }
            catch (_) { message.textContent = '키를 길게 눌러 직접 복사해 주세요.'; }
        });
        confirmPayment();
    </script>
</body>
</html>
