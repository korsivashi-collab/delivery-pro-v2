<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배송 경로 PRO - 통합 관리자 센터</title>
    <link rel="icon" type="image/png" sizes="900x900" href="./icons/site-icon.png?v=20261014-3">
    <link rel="apple-touch-icon" sizes="900x900" href="./icons/site-icon.png?v=20261014-3">
    <!-- Tailwind CSS & Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 공통 분리 스타일시트 -->
    <link rel="stylesheet" href="./css/admin.css">
    <link rel="stylesheet" href="./css/admin-header.css?v=20261022-tracking-lookup">
    <style>
    #login-screen>div{max-height:calc(100dvh - 48px);overflow-y:auto}
    #login-billing-dialog{width:calc(100% - 32px);max-width:1180px;max-height:90dvh;border:0;border-radius:20px;padding:0;background:#f3f6fa;color:#17243b;box-shadow:0 25px 80px #0005}
    #login-billing-dialog::backdrop{background:#0f172ac9}
    .login-billing-header{position:sticky;top:0;z-index:2;background:white;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;border-bottom:1px solid #dce3ed}
    .login-billing-header h2{font-size:20px;font-weight:800}.login-billing-header p{font-size:12px;color:#718096;margin-top:5px}.login-billing-header button{border:1px solid #d5dfec;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:700}
    #login-billing-dialog .dispatch-service-page{overflow:visible;padding:24px}#login-billing-dialog .service-status-tag{display:inline-block;margin-top:8px}
    @media(max-width:500px){#login-billing-dialog{width:calc(100% - 16px);max-height:94dvh}.login-billing-header{padding:17px}.login-billing-header h2{font-size:18px}#login-billing-dialog .dispatch-service-page{padding:16px}}
    </style>

    <!-- 카카오 맵 API (services 라이브러리 포함) -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=893c5c6ec8613974d84fa75fd6d0be11&libraries=services"></script>
</head>
<body class="bg-slate-900 h-screen w-screen flex flex-col overflow-hidden text-gray-800 font-sans">

    <!-- 통합 관리자 로그인 화면 (단일 접속 게이트) -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm bg-white rounded-3xl p-8 shadow-2xl text-center relative overflow-hidden border border-gray-100 animate-slide-up">
            <div class="absolute top-0 left-0 w-full h-1.5 bg-blue-600"></div>
            <div class="mb-4">
                <img src="./icons/header-logo-06-640.png" alt="배송 경로 PRO" width="640" height="357" style="display:block;width:128px;max-width:100%;height:auto;object-fit:contain;margin:0 auto;">
            </div>
            <h2 class="text-xl font-black text-gray-900 mb-1 tracking-tight">통합 관리자 센터</h2>
            <p class="text-xs text-gray-400 mb-6 font-bold">마스터 비밀키 또는 관제 키를 입력해 주세요.</p>
            
            <div id="master-key-step">
            <div class="space-y-3 mb-5 text-left">
                <div class="relative">
                    <i class="fa-solid fa-key absolute left-4 top-4 text-gray-400 text-sm"></i>
                    <input type="text" id="single-key-input" placeholder="관리자 키 입력" class="w-full pl-10 pr-4 py-3.5 bg-gray-50 border border-gray-300 text-gray-900 text-sm font-mono rounded-xl focus:ring-blue-500 focus:border-blue-500 block font-black outline-none transition" onkeyup="if(window.event.keyCode==13){window.handleSingleKeyLogin()}">
                </div>
            </div>
            
            <button onclick="window.handleSingleKeyLogin()" id="login-btn" class="w-full text-white bg-blue-600 hover:bg-blue-700 font-black rounded-xl text-sm px-5 py-3.5 text-center shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
                <span>대시보드 접속</span>
            </button>
            </div>
            <div id="master-sms-step" class="hidden text-left space-y-3">
                <p class="text-sm font-black text-slate-900">마스터 2차 인증</p>
                <p class="text-xs text-slate-600 leading-relaxed">등록된 관리자 번호 <strong>010-8455-7060</strong>로 발송한 인증번호를 입력해 주세요.</p>
                <label for="master-sms-code" class="block text-xs font-bold text-slate-700">인증번호</label>
                <input id="master-sms-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="인증번호 6자리" class="w-full p-3.5 border border-slate-300 rounded-xl text-center text-lg font-mono tracking-widest outline-none focus:border-blue-600" onkeydown="if(event.key==='Enter') window.confirmMasterSmsLogin()">
                <button id="master-sms-confirm" type="button" onclick="window.confirmMasterSmsLogin()" class="w-full bg-blue-600 text-white font-black py-3.5 rounded-xl disabled:opacity-50">인증하고 접속</button>
                <div class="flex justify-between gap-3 text-xs font-bold">
                    <button id="master-sms-resend" type="button" onclick="window.sendMasterLoginSms()" class="text-blue-600 py-2 disabled:opacity-50">인증번호 다시 받기</button>
                    <button type="button" onclick="window.cancelMasterSmsLogin()" class="text-slate-500 py-2">키 입력으로 돌아가기</button>
                </div>
                <div id="master-sms-recaptcha"></div>
            </div>
            <p id="login-msg" class="text-red-500 text-xs mt-3 font-bold min-h-[16px] whitespace-pre-line"></p>
            <a id="login-billing-button" href="?view=billing" onclick="if(window.openLoginBilling){event.preventDefault();window.openLoginBilling();}" class="w-full mt-2 flex items-center justify-center gap-2 rounded-xl border border-blue-200 bg-blue-50 px-4 py-3 text-sm font-bold text-blue-700 hover:bg-blue-100 transition"><i class="fa-solid fa-credit-card" aria-hidden="true"></i>결제·문자 충전</a>
            <p class="mt-3 text-xs text-gray-400">로그인 전에도 <a id="login-pricing-link" href="?view=billing" onclick="if(window.openLoginBilling){event.preventDefault();window.openLoginBilling();}" class="text-blue-600 underline underline-offset-2">관제 요금제·충전 금액</a>을 확인할 수 있습니다.</p>

            <!-- 법적 고지 및 약관 링크 -->
            <div class="mt-5 pt-3 border-t border-gray-100 flex justify-center items-center gap-2 text-[11px] text-gray-400 font-medium">
                <a href="/terms.html" target="_blank" class="hover:text-gray-600 underline transition">이용약관</a>
                <span>·</span>
                <a href="/privacy.html" target="_blank" class="hover:text-gray-600 underline font-bold text-gray-500 transition">개인정보처리방침</a>
                <span>·</span>
                <a href="/policy.html" target="_blank" class="hover:text-gray-600 underline transition">운영정책</a>
            </div>
        </div>
    </div>

    <dialog id="login-billing-dialog" aria-labelledby="dispatch-account-heading"><div class="login-billing-header"><div><h2 id="dispatch-account-heading">결제·문자 충전</h2><p id="dispatch-account-description"></p><span id="dispatch-account-mode-label" class="service-status-tag"></span></div><button type="button" onclick="document.getElementById('login-billing-dialog').close()" aria-label="요금 안내 닫기">닫기</button></div><div class="dispatch-service-page"><p class="customer-review-alert" style="margin-bottom:20px">관제 상품과 문자 충전 금액을 미리 확인하세요. 현재는 금액 확인 단계이며, 실제 결제·충전과 계정 적용은 진행되지 않습니다.</p><div id="dispatch-account-content"></div></div></dialog>
    <dialog id="customer-action-dialog" aria-labelledby="customer-dialog-heading"><div class="customer-dialog-header"><h2 id="customer-dialog-heading"></h2><button type="button" onclick="window.closeCustomerDialog()" aria-label="닫기">×</button></div><div id="customer-dialog-body"></div><div class="customer-dialog-footer"><button type="button" onclick="window.closeCustomerDialog()">닫기</button></div></dialog>
    <!-- ES Modules 방식의 관리자 메인 컨트롤러 및 라우터 연결 -->
    <script type="importmap">{"imports":{"./js/admin-dispatch-core.js":"./js/admin-dispatch-core.js?v=20261017-dispatch-trial-link","./js/admin-api.js":"./js/admin-api.js?v=20261017-dispatch-session-guard","./js/admin-license-save.js":"./js/admin-license-save.js?v=20261017-dispatch-trial-link","./js/admin-master-history.js":"./js/admin-master-history.js?v=20261017-dispatch-trial-link","./js/admin-dispatch-msg.js":"./js/admin-dispatch-msg.js?v=20261022-tracking-lookup","./js/admin-master-licenses.js":"./js/admin-master-licenses.js?v=20261022-dispatch-10-slots"}}</script>
    <script type="module" src="./js/admin-app.js?v=20261022-tracking-lookup"></script>
</body>
</html>
